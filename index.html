<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homefed</title>
<script>
  // A recovery email lands here, on the Site URL; the password changes on /reset. Keep the token.
  if (/(^#|&)(type=recovery|error_code=)/.test(location.hash) || /[?&](code|token_hash)=/.test(location.search)) location.replace('/reset' + location.search + location.hash);
</script>
<meta name="description" content="Your household's kitchen, on every phone in the house.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lora:wght@500&display=swap">
<style>
  :root { --paper: #EDE6D6; --page: #F7F4EC; --ink: #2B2622; --green: #4F8F52; --terracotta: #C2613D; }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--page); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.6;
  }
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    width: 100%; max-width: 640px; margin: 0 auto; padding: 64px 20px 40px; gap: 20px;
  }
  .mark { width: 112px; height: 112px; }
  h1 { margin: 0; font-family: Lora, Georgia, "Times New Roman", serif; font-weight: 500; font-size: 40px; line-height: 1.1; letter-spacing: -0.01em; }
  .line { margin: 0; max-width: 30em; font-size: 18px; }
  .beta { margin: 8px 0 0; padding: 6px 14px; border-radius: 999px; background: var(--paper); font-size: 14px; font-weight: 500; }
  footer { width: 100%; max-width: 640px; margin: 0 auto; padding: 24px 20px 32px; text-align: center; font-size: 14px; }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(43, 38, 34, 0.25); }
  footer a:hover { color: var(--green); border-color: var(--green); }
  .dot { color: rgba(43, 38, 34, 0.45); padding: 0 6px; }
</style>
</head>
<body>
<main>
  <!-- The mark: the app icon's tile (assets/images/make-icon.mjs, 6b) — 180 units, rx 40; Lora's "h" centred at 84 on a 128 baseline, 124 to the em; the dot at (138, 118), r 11. -->
  <svg class="mark" viewBox="0 0 180 180" role="img" aria-label="Homefed">
    <rect width="180" height="180" rx="40" fill="#EDE6D6"/>
    <text x="84" y="128" text-anchor="middle" font-family="Lora, Georgia, 'Times New Roman', serif" font-weight="500" font-size="124" fill="#4F8F52">h</text>
    <circle cx="138" cy="118" r="11" fill="#C2613D"/>
  </svg>
  <h1>homefed</h1>
  <p class="line">Your household's kitchen, on every phone in the house. Plans the week, keeps the pantry honest, tells the cook.</p>
  <p class="beta">Beta in Bengaluru — October 2026</p>
</main>
<footer>
  <a href="privacy.html">Privacy</a><span class="dot">·</span><a href="support.html">Support</a><span class="dot">·</span><a href="mailto:support@homefed.in">support@homefed.in</a>
</footer>
</body>
</html>
